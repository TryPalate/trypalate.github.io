name: preview
# Temporary: renders the redesign with real pictures (screenshots + scroll video) to the branch redesign-preview. Remove before merging.
on:
  push:
    branches: [redesign]
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: |
          mkdir -p $RUNNER_TEMP/pw && cd $RUNNER_TEMP/pw && npm init -y >/dev/null && npm i playwright@1.49.1 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
      - run: |
          python3 -m http.server 8899 >/dev/null 2>&1 &
          sleep 1
          NODE_PATH=$RUNNER_TEMP/pw/node_modules node scripts/preview.cjs
      - run: |
          git config user.name "preview"; git config user.email "actions@users.noreply.github.com"
          mkdir -p /tmp/out && cp -r shots /tmp/out/
          git checkout --orphan prev-tmp && git rm -rf -q . && cp -r /tmp/out/shots/* . && git add -A
          git commit -q -m "preview ${GITHUB_SHA::7}" && git push -f origin HEAD:redesign-preview
