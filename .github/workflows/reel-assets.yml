name: Fetch reel assets
on:
  push:
    branches: [assets]
    paths: [tools/fetch_logos.py, .github/workflows/reel-assets.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq librsvg2-bin
      - run: python3 tools/fetch_logos.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reel-assets && git commit -m "Reel assets" && git push
