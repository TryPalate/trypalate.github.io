  <h1>Rank your top&nbsp;5 <em>in anything.</em></h1>
  <div class="url">trypalate.github.io</div>
</div>
<div id="pols"></div>
<script>
(function(){
const P=[
  {kind:'artist',q:'Bruno Mars',cat:'Artists',x:590,y:150,r:-8,a:'#FFB06B',b:'#FF5C8A'},
  {kind:'album',artist:'Sabrina Carpenter',q:"Short n' Sweet",cat:'Albums',x:760,y:96,r:2,a:'#4FC3F7',b:'#2a6f8f'},
  {kind:'anime',q:'Sousou no Frieren',cat:'Anime',x:920,y:170,r:9,a:'#7BD88F',b:'#2f6d5a'}];
document.getElementById('pols').innerHTML=P.map((p,i)=>`<div class="pol" style="left:${p.x}px;top:${p.y}px;transform:rotate(${p.r}deg)"><div class="ph" id="ph${i}" style="--a:${p.a};--b:${p.b}"></div><p>${p.cat}</p></div>`).join('');
const norm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
function jsonp(u){ return new Promise((res,rej)=>{ const cb='cb'+Math.random().toString(36).slice(2), sc=document.createElement('script');
  const t=setTimeout(()=>{ rej(new Error('timeout')); },10000); window[cb]=d=>{ clearTimeout(t); res(d); }; sc.onerror=()=>rej(new Error('load')); sc.src=u+'&callback='+cb; document.head.appendChild(sc); }); }
async function find(p){
  if(p.kind==='artist'){ const j=await jsonp('https://api.deezer.com/search/artist?limit=10&output=jsonp&q='+encodeURIComponent(p.q));
    const d=((j&&j.data)||[]).filter(a=>a.picture_xl&&!/\/artist\/\//.test(a.picture_xl)&&norm(a.name)===norm(p.q)).sort((a,b)=>(b.nb_fan||0)-(a.nb_fan||0)); return d[0]&&d[0].picture_xl; }
  if(p.kind==='album'){ const j=await jsonp('https://itunes.apple.com/search?media=music&entity=album&limit=25&term='+encodeURIComponent(p.artist+' '+p.q));
    const r=((j&&j.results)||[]).filter(x=>norm(x.artistName).includes(norm(p.artist))); const h=r.find(x=>norm(x.collectionName)===norm(p.q))||r.find(x=>norm(x.collectionName).startsWith(norm(p.q)));
    return h&&h.artworkUrl100.replace(/\/\d+x\d+bb\./,'/600x600bb.'); }
  const r=await fetch('https://graphql.anilist.co',{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({query:'query($s:String){Media(search:$s,type:ANIME){coverImage{extraLarge}}}',variables:{s:p.q}})});
  const j=await r.json(); return j.data.Media.coverImage.extraLarge;
}
const load=src=>new Promise(res=>{ const im=new Image(); im.onload=()=>res(true); im.onerror=()=>res(false); im.src=src; });
Promise.all(P.map(async(p,i)=>{ try{ const src=await find(p); if(src&&await load(src)){ document.getElementById('ph'+i).style.backgroundImage=`url("${src}")`; return true; } }catch(e){} return false; }))
  .then(async ok=>{ try{ if(document.fonts) await document.fonts.ready; }catch(e){} document.body.dataset.ready=ok.filter(Boolean).length; });
})();
</script>
